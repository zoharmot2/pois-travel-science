<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מפת נקודות עניין</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body, html { height: 100%; width: 100%; font-family: sans-serif; }
        #map { height: 100vh; width: 100%; }
        
        .leaflet-popup-content {
            margin: 10px;
            max-width: 280px !important;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const map = L.map('map').setView([31.5, 34.85], 8);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        const FIELDS_TO_SHOW = [
            { key: 'OBJECTID', label: 'OBJECTID' },
            { key: 'GlobalID', label: 'GlobalID' },
            { key: 'CreationDate', label: 'CreationDate' },
            { key: 'Collect_Name', label: 'Collect_Name' },
            { key: 'POI_Name', label: 'POI_Name' },
            { key: 'POI_Topic', label: 'POI_Topic' },
            { key: 'POI_Type', label: 'POI_Type' },
            { key: 'POI_Description', label: 'POI_Description' },
            { key: 'Latitude', label: 'Latitude' },
            { key: 'Longitude', label: 'Longitude' }
        ];

        function buildPopupContent(properties) {
            let html = '<div style="font-family: Arial, sans-serif; font-size: 13px; line-height: 1.4; text-align: left; direction: ltr;">';

            FIELDS_TO_SHOW.forEach(field => {
                const value = properties[field.key];
                if (value !== undefined && value !== null && value !== '') {
                    html += `<div><strong>${field.label}:</strong> ${value}</div>`;
                }
            });

            let attachments = properties.attachments;
            if (attachments) {
                let imgList = [];
                if (Array.isArray(attachments)) {
                    imgList = attachments;
                } else if (typeof attachments === 'string') {
                    imgList = attachments.split(',').map(s => s.trim()).filter(Boolean);
                }

                imgList.forEach(imgPath => {
                    if (imgPath) {
                        html += `
                            <div style="margin-top: 8px;">
                                <a href="${imgPath}" target="_blank">
                                    <img src="${imgPath}" alt="Image" style="width: 100%; max-width: 260px; height: auto; border-radius: 4px; display: block;" />
                                </a>
                            </div>`;
                    }
                });
            }

            html += '</div>';
            return html;
        }

        fetch('data/pois.geojson')
            .then(res => res.json())
            .then(data => {
                const layer = L.geoJSON(data, {
                    onEachFeature: function(feature, layer) {
                        if (feature.properties) {
                            layer.bindPopup(buildPopupContent(feature.properties));
                        }
                    }
                }).addTo(map);

                if (layer.getBounds().isValid()) {
                    map.fitBounds(layer.getBounds(), { padding: [50, 50] });
                }
            });
    </script>
</body>
</html>
