<!DOCTYPE html>
<html lang="he">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>מפת נקודות עניין (POI)</title>
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: Arial, sans-serif;
            overflow: hidden;
            background-color: #f8f9fa;
        }

        #map {
            width: 100%;
            height: 100vh;
        }

        /* עיצוב הפופאפ במפה - יישור לשמאל LTR */
        .leaflet-popup-content-wrapper {
            border-radius: 8px;
            padding: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .leaflet-popup-content {
            margin: 12px;
            max-width: 280px !important;
            font-size: 13px;
            line-height: 1.45;
            color: #222;
            direction: ltr !important;
            text-align: left !important;
        }

        .popup-field {
            margin-bottom: 3px;
            word-wrap: break-word;
            word-break: break-all;
            direction: ltr;
            text-align: left;
        }

        .popup-field strong {
            color: #000;
        }

        .popup-img {
            width: 100%;
            max-width: 260px;
            height: auto;
            max-height: 220px;
            object-fit: cover;
            border-radius: 6px;
            display: block;
            margin-top: 8px;
            border: 1px solid #ddd;
            box-shadow: 0 1px 4px rgba(0,0,0,0.15);
            image-orientation: from-image;
        }
    </style>
</head>
<body>

    <div id="map"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <script>
        // 1. אתחול המפה
        const map = L.map('map').setView([31.5, 34.85], 8);

        // 2. טעינת אריחי OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // רשימת השדות המבוקשת בסדר המדויק
        const displayFields = [
            { key: "OBJECTID", label: "OBJECTID" },
            { key: "GlobalID", label: "GlobalID" },
            { key: "CreationDate", label: "CreationDate" },
            { key: "Collect_Name", label: "Collect_Name" },
            { key: "POI_Name", label: "POI_Name" },
            { key: "POI_Topic", label: "POI_Topic" },
            { key: "POI_Type", label: "POI_Type" },
            { key: "POI_Description", label: "POI_Description" },
            { key: "Latitude", label: "Latitude" },
            { key: "Longitude", label: "Longitude" }
        ];

        // פונקציית יצירת תוכן ה-Popup
        function buildPopupContent(properties) {
            let html = '<div style="direction: ltr; text-align: left;">';

            // הוספת השדות
            displayFields.forEach(field => {
                const val = properties[field.key];
                if (val !== undefined && val !== null && val !== "") {
                    html += `<div class="popup-field"><strong>${field.label}:</strong> ${val}</div>`;
                }
            });

            // הוספת התמונות המצורפות
            let attachments = properties.attachments;
            if (attachments) {
                let imgList = [];
                if (Array.isArray(attachments)) {
                    imgList = attachments;
                } else if (typeof attachments === 'string') {
                    imgList = attachments.split(',').map(s => s.trim()).filter(Boolean);
                }

                imgList.forEach(imgPath => {
                    if (imgPath) {
                        html += `
                            <a href="${imgPath}" target="_blank">
                                <img src="${imgPath}" alt="POI Image" class="popup-img" />
                            </a>`;
                    }
                });
            }

            html += '</div>';
            return html;
        }

        // 3. טעינת ה-GeoJSON מתוך data/pois.geojson
        fetch('data/pois.geojson')
            .then(res => res.json())
            .then(data => {
                const geojsonLayer = L.geoJSON(data, {
                    // עיגולים בצבע אדום-חום #8B261D
                    pointToLayer: function (feature, latlng) {
                        return L.circleMarker(latlng, {
                            radius: 7,
                            fillColor: "#8B261D",
                            color: "#FFFFFF",
                            weight: 1.5,
                            opacity: 1,
                            fillOpacity: 0.85
                        });
                    },

                    // חיבור פופאפ ואפקט מעבר עכבר
                    onEachFeature: function (feature, layer) {
                        if (feature.properties) {
                            layer.bindPopup(buildPopupContent(feature.properties));
                        }

                        layer.on({
                            mouseover: function (e) {
                                e.target.setStyle({
                                    radius: 9,
                                    fillColor: "#A63228",
                                    weight: 2
                                });
                            },
                            mouseout: function (e) {
                                e.target.setStyle({
                                    radius: 7,
                                    fillColor: "#8B261D",
                                    weight: 1.5
                                });
                            }
                        });
                    }
                }).addTo(map);

                // התאמת זום למיקומי הנקודות
                if (geojsonLayer.getBounds().isValid()) {
                    map.fitBounds(geojsonLayer.getBounds(), { padding: [40, 40] });
                }
            })
            .catch(err => console.error("שגיאה בטעינת הנתונים:", err));
    </script>
</body>
</html>
