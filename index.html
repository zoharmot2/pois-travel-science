<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Points of Interest (POI) Map - v1.4.0</title>

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/app.css">
</head>
<body>
    <header>
        <h1>Points of Interest (POI) Map</h1>
        <div id="poiCount" class="poi-count-badge">Loading...</div>
    </header>

    <main id="appWorkspace">
        <div id="map"></div>
        <aside id="entityDetailPanel" class="entity-detail-panel" aria-hidden="true" aria-label="POI details">
            <div class="entity-detail-header">
                <div class="entity-detail-heading">
                    <div class="entity-detail-eyebrow">POI Details</div>
                    <h2 id="entityDetailTitle">POI Details</h2>
                </div>
                <button id="entityDetailClose" class="entity-detail-close" type="button" aria-label="Close details">×</button>
            </div>
            <div id="entityDetailContent" class="entity-detail-content"></div>
        </aside>
    </main>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <!-- Leaflet Terminator (Day/Night Overlay) -->
    <script src="https://unpkg.com/@joergdietrich/leaflet.terminator"></script>

    <script type="module" src="js/app.js"></script>
</body>
</html>
