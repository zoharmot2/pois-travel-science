name: Sync ESRI Data Weekly

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fpdf2 python-bidi Pillow

      - name: Preserve Previous Spatial Data for QA
        run: |
          for file in data/pois.geojson data/lines.geojson data/polygons.geojson; do
            if [ -f "$file" ]; then
              mkdir -p ".qa-baseline/$(dirname "$file")"
              cp "$file" ".qa-baseline/$file"
            fi
          done

      - name: Fetch Points, Lines and Polygons
        run: python scripts/fetch_data.py

      - name: Validate Generated Data
        run: python scripts/qa_data.py --baseline-root .qa-baseline

      - name: Validate Frontend Regression Structure
        run: python scripts/qa_frontend.py

      - name: Upload QA Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-qa-report-${{ github.run_number }}
          path: data/derived/qa-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: Commit and Push Updated Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git add data/
          git reset -- data/derived/qa-report.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of spatial data, CSV, PDF and attachments" && git push)
