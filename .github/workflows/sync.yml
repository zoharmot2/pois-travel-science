name: Sync ESRI Data Weekly

on:
  schedule:
    - cron: '0 0 * * 0' # מורץ מדי יום ראשון בחצות UTC
  workflow_dispatch: # מאפשר הרצה ידנית מתוך לשונית Actions ב-GitHub

jobs:
  sync-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Fetch Data from ESRI
        run: python scripts/fetch_data.py

      - name: Commit and Push Updated GeoJSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/pois.geojson
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update of POIs GeoJSON" && git push)